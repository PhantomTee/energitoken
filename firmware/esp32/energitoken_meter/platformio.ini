; Build-checks this sketch headlessly, without a physical board or the
; Arduino IDE -- catches a compile error before it costs a drive out to
; flash a meter. Versions pinned to what actually built clean (2026-08-28,
; see the repo history for that verification), since nothing here was
; pinned before and PlatformIO's registry resolves "latest" by default,
; which drifts.
;
; Usage: `pio run` from this directory. First run downloads the ESP32
; toolchain (~a few hundred MB) and these libraries -- expect several
; minutes. `pio run` again after any further edit is fast (cached).
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
lib_deps =
    https://github.com/mobizt/Firebase-ESP-Client.git#v4.4.17
    mandulaj/PZEM-004T-v30 @ 1.1.2
    marcoschwartz/LiquidCrystal_I2C @ 1.1.4
    chris--a/Keypad @ 3.1.1
